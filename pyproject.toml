
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqsum"
version = "0.1.0"
description = "Annotate requirements.txt with package summaries from PyPI (no AI)."
readme = "README.md"
authors = [{name="reqsum"}]
license = {text = "GPLv3"}
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28",
  "packaging>=23.0",
]

[project.scripts]
reqsum = "reqsum.cli:main"
